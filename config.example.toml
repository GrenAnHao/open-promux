# SERVER SETTINGS
# ===========================================
#
# Local listen port (default: 8080)
# open-promux listens on 0.0.0.0 using this port.
# Change this when port 8080 is already used by another application.
port = 8080

# Proxy authentication key (optional)
# When set, clients must send `Authorization: Bearer <auth_key>`
# to open-promux for all proxy endpoints:
#   - GET  /v1/models
#   - POST /v1/responses
#   - POST /v1/chat/completions
#
# Leave this commented out to disable proxy-side authentication.
# auth_key = "change-me"

# PERFORMANCE SETTINGS
# ===========================================
#
# open-promux creates one long-lived HTTP client per upstream.
# This reuses TCP/TLS/proxy connections and allows HTTP/2 multiplexing
# when the upstream supports it.
#
# Optional per-upstream concurrency limit.
# Streaming responses hold one slot until the stream finishes.
# Leave unset or set to 0 to disable this limit.
# [performance]
# upstream_max_concurrent_requests = 64
# global_rpm = 600
# global_tpm = 120000

# ROUTING SETTINGS
# ===========================================
#
# load_balance:
#   - "first"       : use the first matching upstream (default)
#   - "round_robin" : rotate between matching upstreams for the same model
#
# automatic_failover retries the next matching upstream after retryable
# upstream failures (403, 429, or 5xx). Leave false to preserve strict
# first-match behavior.
#
# fallback_model routes unmatched requested models to a configured model.
# Like aliases, it accepts a plain model id or a prefixed `name:model` id.
#
# model_aliases maps client-facing model names to upstream models. Targets
# can be plain model ids or prefixed `name:model` ids when upstream names
# are configured. Aliases are hidden from /v1/models by default; set
# expose_model_aliases = true only if clients must discover them.
# [routing]
# load_balance = "first"
# automatic_failover = false
# fallback_model = "local:qwen3-coder"
# expose_model_aliases = false
# [routing.model_aliases]
# "gpt-5.5" = "openai:gpt-4.1"
# "gpt-5.4" = "local:qwen3-coder"
# "gpt-5.4-mini" = "local:qwen3-coder-mini"

# HEALTH CHECK SETTINGS
# ===========================================
#
# Disabled by default. When enabled, open-promux periodically calls
# `{upstream.url}/models`. Failed checks mark an upstream unhealthy after
# `unhealthy_after_failures`; unhealthy upstreams are skipped by routing.
# [health]
# enabled = true
# interval_millis = 30000
# unhealthy_after_failures = 3

# RECTIFIER SETTINGS
# ===========================================
#
# Enabled by default. Applies only to Anthropic Messages upstreams.
# When Anthropic-compatible providers reject a request due to known
# thinking signature or budget compatibility errors, open-promux minimally
# rectifies the converted request and retries the same upstream once.
# [rectifier]
# enabled = true
# thinking_signature = true
# thinking_budget = true

# UPSTREAM PROVIDERS
# ===========================================
#
# Configure one or more upstream providers.
# By default, each upstream uses OpenAI-compatible Chat Completions:
#   - GET  {url}/models
#   - POST {url}/chat/completions
#
# Set `api_format = "anthropic_messages"` for Anthropic Messages upstreams.
# In that mode, /v1/responses is converted and forwarded to:
#   - POST {url}/messages
#
# In multi-upstream mode, open-promux merges all upstream model lists.
# If `name` is set, exposed model ids become `name:model`.
# For example, upstream model `gpt-4.1-mini` with name `openai`
# is exposed as `openai:gpt-4.1-mini`.
#
# Requests using `name:model` are routed to the named upstream.
# Before forwarding, open-promux strips the `name:` prefix and sends
# the raw upstream model id.
# Plain model ids are forwarded unchanged. In multi-upstream mode,
# model lists are prefetched on startup and cached briefly for routing.

# OPENAI-COMPATIBLE UPSTREAM
# -------------------------------------------
[[upstreams]]

# Upstream display/routing name (optional)
# When omitted, model ids are exposed without a prefix.
name = "openai"

# Upstream API base URL (required)
# Usually ends with `/v1`.
url = "https://api.openai.com/v1"

# Upstream API key (optional)
# Leave empty only when the upstream does not require authentication.
api_key = "sk-your-api-key"

# Authentication header name (optional, default: Authorization)
# When using Authorization, open-promux automatically sends
# `Authorization: Bearer <api_key>` unless api_key already starts with `Bearer `.
# auth_header = "Authorization"

# Per-upstream proxy (optional)
# Format: host:port or host:port:username:password
# proxy = "127.0.0.1:7890"
# proxy_type = "http"
#
# Optional per-upstream overrides.
# max_concurrent_requests overrides [performance].upstream_max_concurrent_requests.
# rpm and tpm are fixed 60-second window request/token limits.
# max_concurrent_requests = 32
# rpm = 300
# tpm = 60000

# ANTHROPIC MESSAGES UPSTREAM
# -------------------------------------------
[[upstreams]]

# Requests can use model ids like `anthropic:claude-sonnet-4-5`.
name = "anthropic"

# Anthropic-compatible Messages API base URL.
url = "https://api.anthropic.com/v1"

# Anthropic uses x-api-key instead of Authorization.
api_key = "sk-ant-your-api-key"
auth_header = "x-api-key"

# Convert OpenAI Responses API requests to Anthropic Messages API.
api_format = "anthropic_messages"

# CUSTOM OR LOCAL UPSTREAM
# -------------------------------------------
[[upstreams]]

# Use a different name to distinguish models from this provider.
# For example, model `qwen3` is exposed as `local:qwen3`.
name = "local"

# Local or custom OpenAI-compatible upstream URL.
url = "http://127.0.0.1:8000/v1"

# API key for this upstream.
api_key = "your-secret"

# Example for providers that expect a custom header instead of Authorization.
auth_header = "api-key"

# proxy = "127.0.0.1:1080:user:pass"
# proxy_type = "socket"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── CLI binary (single static `open-promux` per target triple) ──
  build-cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: open-promux-x86_64-unknown-linux-gnu.tar.gz
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: open-promux-x86_64-pc-windows-msvc.zip
            exe: ".exe"
          - os: macos-14
            target: x86_64-apple-darwin
            archive: open-promux-x86_64-apple-darwin.tar.gz
            exe: ""
          - os: macos-14
            target: aarch64-apple-darwin
            archive: open-promux-aarch64-apple-darwin.tar.gz
            exe: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p open-promux --bin open-promux

      - name: Package release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/open-promux${{ matrix.exe }}" "package/open-promux${{ matrix.exe }}"
          Copy-Item "config.example.toml" "package/config.example.toml"
          Copy-Item "README.md" "package/README.md"
          Copy-Item "README-CN.md" "package/README-CN.md"

          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.archive }}" -Force
          } else {
            tar -czf "${{ matrix.archive }}" -C package .
          }

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # ── Desktop bundle (Tauri 2: MSI/EXE on Windows, DMG on macOS, deb/AppImage on Linux) ──
  build-desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_glob: "desktop/src-tauri/target/release/bundle/{deb/*.deb,appimage/*.AppImage,rpm/*.rpm}"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_glob: "desktop/src-tauri/target/release/bundle/{msi/*.msi,nsis/*.exe}"
          - os: macos-14
            target: aarch64-apple-darwin
            bundle_glob: "desktop/src-tauri/target/release/bundle/{dmg/*.dmg,macos/*.app.tar.gz}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri bundle
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Stage desktop bundles
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          # Tauri builds into the workspace root `target/` because we share
          # the Cargo workspace between the proxy lib and desktop crate.
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_ROOT" ]; then
            BUNDLE_ROOT="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          fi
          echo "Bundle root: $BUNDLE_ROOT"
          ls -R "$BUNDLE_ROOT" || true
          # macOS 3.2 doesn't support globstar; use find for portability.
          find "$BUNDLE_ROOT" -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \
            -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \
            -o -name "*.app.tar.gz" \) \
            -exec cp {} desktop-artifacts/ \;
          ls -la desktop-artifacts/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-promux-desktop-${{ matrix.target }}
          path: desktop-artifacts/*
          if-no-files-found: warn

  # ── Aggregate everything onto the GitHub Release ──
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - build-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --clobber
          else
            gh release create "$TAG_NAME" artifacts/* --title "open-promux $TAG_NAME" --generate-notes
          fi
